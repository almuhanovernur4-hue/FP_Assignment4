<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 1 - Book a Train Ticket</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="style1.css">
</head>
<body class="p-3 p-md-5">

<div class="card ticket-card mx-auto">
  <div class="card-header border-0 py-3 px-4">
    <h2 class="h4 m-0 text-white fw-bold">Book a train ticket</h2>
  </div>

  <div class="card-body p-4">
    <form>
      <div class="d-flex justify-content-center mb-4">
        <div class="trip-type-toggle p-1 d-inline-flex rounded-pill">
          <input type="radio" class="btn-check" name="tripType" id="oneWay" checked>
          <label class="btn btn-trip rounded-pill px-4 py-2" for="oneWay">One way</label>

          <input type="radio" class="btn-check" name="tripType" id="roundTrip">
          <label class="btn btn-trip rounded-pill px-4 py-2" for="roundTrip">Round trip</label>
        </div>
      </div>

      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label for="fromCity" class="form-label small fw-bold text-secondary">From</label>
          <input type="text" class="form-control custom-input" id="fromCity" value="Astana" required>
        </div>
        <div class="col-md-6">
          <label for="toCity" class="form-label small fw-bold text-secondary">To</label>
          <input type="text" class="form-control custom-input" id="toCity" value="Almaty" required>
        </div>
      </div>

      <div class="row g-3 mb-4">
        <div class="col-md-4">
          <label for="depDate" class="form-label small fw-bold text-secondary">Departure</label>
          <input type="date" class="form-control custom-input" id="depDate" required>
        </div>
        <div class="col-md-4">
          <label for="retDate" class="form-label small fw-bold text-secondary">Return</label>
          <input type="date" class="form-control custom-input" id="retDate" required>
        </div>
        <div class="col-md-4">
          <label for="passengers" class="form-label small fw-bold text-secondary">Passengers</label>
          <select class="form-select custom-input" id="passengers">
            <option value="1" selected>1 adult</option>
            <option value="2">2 adults</option>
            <option value="3">3 adults</option>
            <option value="4">4 adults</option>
            <option value="5">5 adults</option>
            <option value="6">6 adults</option>
          </select>
        </div>
      </div>

      <div class="mb-4">
        <label class="form-label small fw-bold text-secondary d-block">Carriage class</label>
        <div class="d-flex gap-4">
          <div class="form-check">
            <input class="form-check-input" type="radio" name="carriageClass" id="seat" required>
            <label class="form-check-label" for="seat">Seat</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="carriageClass" id="coupe" checked required>
            <label class="form-check-label" for="coupe">Coupé</label>
          </div>
          <div class="form-check">
            <input class="form-check-input" type="radio" name="carriageClass" id="sleeper" required>
            <label class="form-check-label" for="sleeper">Sleeper</label>
          </div>
        </div>
      </div>

      <div class="row g-3 mb-3">
        <div class="col-md-6">
          <label for="phone" class="form-label small fw-bold text-secondary">Phone</label>
          <div class="input-group">
            <span class="input-group-text bg-theme text-white border-0 fw-bold px-3">+7</span>
            <input type="tel" class="form-control custom-input" id="phone" placeholder="701 234 56 78" required>
          </div>
        </div>
        <div class="col-md-6">
          <label for="email" class="form-label small fw-bold text-secondary">Email</label>
          <input type="email" class="form-control custom-input" id="email" placeholder="name@example.com" required>
        </div>
      </div>

      <div class="mb-4">
        <div class="form-check form-switch mb-2">
          <input class="form-check-input" type="checkbox" id="smsTicket">
          <label class="form-check-label small text-secondary" for="smsTicket">Also send the ticket by SMS</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="checkbox" id="agreeRules" required>
          <label class="form-check-label small text-secondary" for="agreeRules">I agree with the carriage rules</label>
        </div>
      </div>

      <div class="d-flex flex-column flex-md-row justify-content-md-end gap-3 mt-4">
        <button type="reset" class="btn btn-outline-custom order-2 order-md-1 px-4 py-2">Clear</button>
        <button type="submit" class="btn btn-find order-1 order-md-2 px-4 py-2">Find trains</button>
      </div>
    </form>
  </div>
</div>

</body>
</html>

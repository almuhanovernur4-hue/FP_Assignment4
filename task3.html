<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Reserve a table</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@400;500;600;700&display=swap" rel="stylesheet">
  <style>
    body {
      font-family: 'Montserrat', sans-serif !important;
      background-color: #f4f7f6;
    }

    .title-green {
      color: #0F6B5F !important;
    }

    .btn-green {
      background-color: #0F6B5F !important;
      color: #ffffff !important;
      border: none !important;
      font-weight: 600;
      transition: background-color 0.2s ease;
    }

    .btn-green:hover {
      background-color: #0b5249 !important;
    }

    .form-control:focus, .form-select:focus {
      border-color: #0F6B5F !important;
      box-shadow: 0 0 0 0.25rem rgba(15, 107, 95, 0.2) !important;
    }

    .form-check-input:checked {
      background-color: #0F6B5F !important;
      border-color: #0F6B5F !important;
    }

    .form-check-input:focus {
      border-color: #0F6B5F !important;
      box-shadow: 0 0 0 0.25rem rgba(15, 107, 95, 0.2) !important;
    }
  </style>
</head>
<body class="py-5">
<div class="container d-flex justify-content-center">
  <div class="card border-0 shadow-lg w-100 p-4 p-md-5" style="max-width: 600px; border-radius: 16px;">

    <h2 class="title-green fw-bold mb-4">Reserve a table</h2>

    <form>
      <div class="mb-3">
        <label for="name" class="form-label fw-semibold">Your Name</label>
        <input type="text" class="form-control" id="name" placeholder="Your name" required>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label fw-semibold">Email</label>
        <input type="email" class="form-control" id="email" placeholder="Email" required>
      </div>

      <div class="mb-3">
        <label for="phone" class="form-label fw-semibold">Phone</label>
        <input type="tel" class="form-control" id="phone" placeholder="+7..." required>
      </div>

      <div class="mb-3">
        <label for="guests" class="form-label fw-semibold">Guests</label>
        <input type="number" class="form-control" id="guests" min="1" max="20" value="2" required>
      </div>

      <div class="mb-3">
        <label for="tableDate" class="form-label fw-semibold">Date</label>
        <input type="date" class="form-control" id="tableDate" required>
      </div>

      <div class="mb-3">
        <label class="form-label fw-semibold d-block">Seating:</label>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="seating" id="inside" checked>
          <label class="form-check-label" for="inside">Inside</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="seating" id="terrace">
          <label class="form-check-label" for="terrace">Terrace</label>
        </div>
      </div>

      <div class="mb-3">
        <label for="mealTime" class="form-label fw-semibold">Meal Time</label>
        <select class="form-select" id="mealTime">
          <option value="lunch">Lunch</option>
          <option value="dinner">Dinner</option>
        </select>
      </div>

      <div class="mb-3">
        <label for="comments" class="form-label fw-semibold">Comments</label>
        <textarea class="form-control" id="comments" rows="3" placeholder="Comments"></textarea>
      </div>

      <div class="mb-4 form-check">
        <input class="form-check-input" type="checkbox" id="terms" required>
        <label class="form-check-label" for="terms">I agree to the terms</label>
      </div>

      <button type="submit" class="btn btn-green w-100 py-2 rounded-3">Reserve</button>
    </form>
  </div>
</div>
</body>
</html>

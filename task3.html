<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Task 3 - Reserve a Table</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light p-4">
<div class="container" style="max-width: 500px;">
  <div class="card p-4 shadow-sm">
    <h2 class="mb-3">Reserve a table</h2>
    <form action="#" method="POST">
      <div class="mb-3">
        <label for="userName" class="form-label">Your Name</label>
        <input type="text" class="form-control" id="userName" name="userName" required>
      </div>
      <div class="mb-3">
        <label for="userEmail" class="form-label">Email</label>
        <input type="email" class="form-control" id="userEmail" name="userEmail" required>
      </div>
      <div class="mb-3">
        <label for="phone" class="form-label">Phone</label>
        <input type="tel" class="form-control" id="phone" name="phone" required>
      </div>
      <div class="mb-3">
        <label for="guests" class="form-label">Guests</label>
        <input type="number" class="form-control" id="guests" name="guests" min="1" max="20" required>
      </div>
      <div class="mb-3">
        <label for="resDate" class="form-label">Date</label>
        <input type="date" class="form-control" id="resDate" name="resDate" required>
      </div>

      <fieldset class="mb-3">
        <legend class="col-form-label pt-0 fw-bold">Seating</legend>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="seating" id="inside" value="inside" checked>
          <label class="form-check-label" for="inside">Inside</label>
        </div>
        <div class="form-check">
          <input class="form-check-input" type="radio" name="seating" id="terrace" value="terrace">
          <label class="form-check-label" for="terrace">Terrace</label>
        </div>
      </fieldset>

      <div class="mb-3">
        <label for="mealTime" class="form-label">Meal Time</label>
        <select class="form-select" id="mealTime" name="mealTime">
          <option value="lunch">Lunch</option>
          <option value="dinner">Dinner</option>
        </select>
      </div>

      <div class="mb-3">
        <label for="comments" class="form-label">Comments</label>
        <textarea class="form-control" id="comments" name="comments" rows="3"></textarea>
      </div>

      <div class="mb-3 form-check">
        <input type="checkbox" class="form-check-input" id="terms" name="terms" required>
        <label class="form-check-label" for="terms">I agree to the terms</label>
      </div>

      <button type="submit" class="btn btn-primary w-100">Reserve</button>
    </form>
  </div>
</div>
</body>
</html>
